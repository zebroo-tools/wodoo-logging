# .github/workflows/flow1.yml
name: Deploy fixes to other versions with rebase main
on:
  push:
    branches:
      - "main"

permissions: write-all

jobs:
  deploy-subversions:
    uses: zebroo-tools/git-workflows/.github/workflows/deploy_to_subversions.yml@v4
    secrets: inherit
    with:
      repo_url: git@github.com:zebroo-tools/wodoo-logging.git
      branches: "15.0:main 16.0:main 17.0:main"
      

  